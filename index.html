<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Product Initiatives — Progress Tracker</title>
<style>
  :root{
    --navy:#1F3864; --navy-light:#2E4E8C; --gold:#B08D57;
    --bg:#F3F5F8; --card:#FFFFFF; --border:#E3E6EA; --text:#2A2E35; --muted:#6B7280;
    --green:#1C8A5A; --green-bg:#E6F5EE;
    --blue:#2461B3; --blue-bg:#E8F0FC;
    --amber:#B07A17; --amber-bg:#FBF1DD;
    --red:#B0392F; --red-bg:#FBEAE8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);}

  header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);color:#fff;padding:22px 28px;}
  header h1{margin:0 0 4px 0;font-size:22px;}
  header .sub{font-size:13px;opacity:0.85;}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);padding:14px 28px;
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
  .toolbar input[type="text"]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--border);border-radius:7px;font-size:14px;}
  .toolbar select{padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:#fff;}
  .toolbar button{padding:9px 14px;border-radius:7px;border:1px solid var(--navy);background:var(--navy);color:#fff;
    font-size:13px;cursor:pointer;font-weight:600;}
  .toolbar button.secondary{background:#fff;color:var(--navy);}
  .toolbar button:hover{opacity:0.9;}

  .stats{display:flex;gap:10px;padding:14px 28px;flex-wrap:wrap;}
  .stat-card{flex:1;min-width:120px;background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:12px 16px;}
  .stat-card .num{font-size:22px;font-weight:700;color:var(--navy);}
  .stat-card .lbl{font-size:12px;color:var(--muted);margin-top:2px;}
  .stat-card.live .num{color:var(--green);} .stat-card.progress .num{color:var(--blue);}
  .stat-card.planning .num{color:var(--amber);} .stat-card.blocked .num{color:var(--red);}

  main{padding:6px 28px 40px 28px;}

  .section{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:18px;overflow:hidden;}
  .section-header{display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;background:#FAFBFC;
    border-bottom:1px solid var(--border);user-select:none;}
  .section-header:hover{background:#F1F4F8;}
  .section-header .chevron{transition:transform 0.15s ease;font-size:12px;color:var(--navy);width:14px;}
  .section.collapsed .chevron{transform:rotate(-90deg);}
  .section-header .title{font-weight:700;color:var(--navy);font-size:15px;flex:1;}
  .section-header .count{font-size:12px;color:#fff;background:var(--gold);padding:3px 10px;border-radius:12px;font-weight:600;}
  .section-body{overflow:hidden;}
  .section.collapsed .section-body{display:none;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;padding:10px 12px;background:#fff;border-bottom:2px solid var(--border);
    color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:0.4px;cursor:pointer;white-space:nowrap;}
  thead th:hover{color:var(--navy);}
  thead th .arrow{font-size:10px;margin-left:3px;opacity:0.5;}
  thead th.sorted .arrow{opacity:1;color:var(--navy);}
  tbody tr.row-main{border-bottom:1px solid var(--border);cursor:pointer;}
  tbody tr.row-main:hover{background:#FAFBFC;}
  tbody td{padding:10px 12px;vertical-align:top;}
  tbody td.sn{color:var(--muted);width:32px;}
  tbody td.project{font-weight:600;color:var(--text);min-width:180px;}
  tbody td.owner{color:var(--muted);white-space:nowrap;}
  tbody td.dates{color:var(--muted);white-space:nowrap;font-size:12.5px;}

  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;}
  .badge.live{background:var(--green-bg);color:var(--green);}
  .badge.progress{background:var(--blue-bg);color:var(--blue);}
  .badge.planning{background:var(--amber-bg);color:var(--amber);}
  .badge.blocked{background:var(--red-bg);color:var(--red);}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

  .progress-wrap{width:90px;height:6px;background:#EDEFF2;border-radius:4px;margin-top:6px;overflow:hidden;}
  .progress-bar{height:100%;border-radius:4px;}
  .progress-bar.live{background:var(--green);} .progress-bar.progress{background:var(--blue);}
  .progress-bar.planning{background:var(--amber);} .progress-bar.blocked{background:var(--red);}

  tr.row-detail td{background:#FAFBFC;padding:14px 20px 18px 40px;border-bottom:1px solid var(--border);}
  tr.row-detail{display:none;}
  tr.row-detail.open{display:table-row;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .detail-field{margin-bottom:6px;}
  .detail-field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  .detail-field .val{font-size:13.5px;color:var(--text);white-space:pre-wrap;}
  .detail-field textarea, .detail-field input, .detail-field select{
    width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;}
  .detail-field textarea{min-height:56px;resize:vertical;}
  .row-actions{display:flex;gap:8px;margin-top:10px;}
  .row-actions button{padding:6px 12px;font-size:12px;border-radius:6px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;font-weight:600;}
  .row-actions button.primary{background:var(--navy);color:#fff;}
  .row-actions button.danger{border-color:var(--red);color:var(--red);}
  .edit-icon{opacity:0.5;font-size:13px;margin-left:6px;}
  .edit-icon:hover{opacity:1;}
  .edited-flag{font-size:10px;color:#fff;background:var(--gold);padding:1px 6px;border-radius:8px;font-weight:700;margin-left:8px;}

  .no-results{padding:30px;text-align:center;color:var(--muted);font-size:14px;}
  .hidden{display:none !important;}

  footer{text-align:center;padding:20px;color:var(--muted);font-size:12px;}
</style>
</head>

<main id="main"></main>

const STORAGE_KEY = 'progressTrackerEdits_v1';

function statusCategory(status){
  if(!status) return {key:'planning', label:'Planning'};
  const s = status.toLowerCase();
  if(s.includes('delay') || s.includes('awaiting') || s.includes('pending') || s.includes('under discussion') || s.includes('blocked'))
    return {key:'blocked', label:'Blocked / Awaiting'};
  if(s.includes('live') || s.includes('go-live') || s.includes('launch'))
    return {key:'live', label:'Live'};
  if(s.includes('progress') || s.includes('uat') || s.includes('testing') || s.includes('staging') || s.includes('integration') || s.includes('completed'))
    return {key:'progress', label:'In Progress'};
  return {key:'planning', label:'Planning'};
}
function progressPct(catKey){
  return {live:100, progress:65, planning:25, blocked:15}[catKey] ?? 20;
}

function loadEdits(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }catch(e){ return {}; }
}
function saveEdits(edits){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(edits));
}

let edits = loadEdits();
let DATA = RAW_DATA.map(d => {
  const key = d.tracker + '::' + d.sn;
  const merged = Object.assign({}, d, edits[key] || {});
  merged._key = key;
  merged._edited = !!edits[key];
  return merged;
});

let sortState = {}; // per tracker: {col, dir}
let sectionCollapsed = {}; // per tracker: bool

const trackers = [...new Set(DATA.map(d => d.tracker))];

function fieldLabel(f){
  return {description:'Description', comments:'Comments / IT Notes', action:'Action Required', start:'Start Date', target:'Target / Live Date', parked:'Parked With', status:'Current Status / Stage'}[f] || f;
}

function esc(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderStats(){
  const cats = {live:0, progress:0, planning:0, blocked:0};
  DATA.forEach(d => cats[statusCategory(d.status).key]++);
  const bar = document.getElementById('statsBar');
  bar.innerHTML = `
    <div class="stat-card"><div class="num">${DATA.length}</div><div class="lbl">Total Initiatives</div></div>
    <div class="stat-card live"><div class="num">${cats.live}</div><div class="lbl">Live</div></div>
    <div class="stat-card progress"><div class="num">${cats.progress}</div><div class="lbl">In Progress</div></div>
    <div class="stat-card planning"><div class="num">${cats.planning}</div><div class="lbl">Planning</div></div>
    <div class="stat-card blocked"><div class="num">${cats.blocked}</div><div class="lbl">Blocked / Awaiting</div></div>
  `;
}

function populateTrackerFilter(){
  const sel = document.getElementById('trackerFilter');
  trackers.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    sel.appendChild(opt);
  });
}

function matchesFilters(d){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const trackerF = document.getElementById('trackerFilter').value;
  const statusF = document.getElementById('statusFilter').value;
  if(trackerF && d.tracker !== trackerF) return false;
  if(statusF && statusCategory(d.status).key !== statusF) return false;
  if(q){
    const hay = [d.project, d.description, d.status, d.comments, d.action, d.parked, d.start, d.target]
      .map(x => (x||'').toString().toLowerCase()).join(' | ');
    if(!hay.includes(q)) return false;
  }
  return true;
}

function sortRows(rows, tracker){
  const st = sortState[tracker];
  if(!st) return rows;
  const {col, dir} = st;
  const sorted = [...rows].sort((a,b) => {
    let va = (a[col] ?? '').toString().toLowerCase();
    let vb = (b[col] ?? '').toString().toLowerCase();
    if(col === 'sn'){ va = a.sn; vb = b.sn; return dir*(va-vb); }
    if(va < vb) return -1*dir;
    if(va > vb) return 1*dir;
    return 0;
  });
  return sorted;
}

function toggleSection(tracker){
  sectionCollapsed[tracker] = !sectionCollapsed[tracker];
  render();
}

function toggleRow(key){
  const el = document.querySelector(`tr.row-detail[data-key="${CSS.escape(key)}"]`);
  if(el) el.classList.toggle('open');
}

function startEdit(key){
  const el = document.querySelector(`tr.row-detail[data-key="${CSS.escape(key)}"]`);
  if(el){ el.classList.add('open'); el.dataset.editing = 'true'; render(); }
}

function saveRow(key){
  const row = DATA.find(d => d._key === key);
  const form = document.querySelector(`tr.row-detail[data-key="${CSS.escape(key)}"] .edit-form`);
  if(!row || !form) return;
  const fields = ['status','start','target','description','comments','action','parked'];
  const updated = {};
  fields.forEach(f => {
    const input = form.querySelector(`[data-field="${f}"]`);
    if(input) updated[f] = input.value;
  });
  edits[row._key] = Object.assign({}, edits[row._key]||{}, updated);
  saveEdits(edits);
  Object.assign(row, updated);
  row._edited = true;
  const el = document.querySelector(`tr.row-detail[data-key="${CSS.escape(key)}"]`);
  if(el){ el.dataset.editing = 'false'; el.classList.add('open'); }
  render(true);
}

function cancelEdit(key){
  const el = document.querySelector(`tr.row-detail[data-key="${CSS.escape(key)}"]`);
  if(el) el.dataset.editing = 'false';
  render(true);
}

function revertRow(key){
  delete edits[key];
  saveEdits(edits);
  const orig = RAW_DATA.find(d => (d.tracker+'::'+d.sn) === key);
  const row = DATA.find(d => d._key === key);
  if(orig && row){
    Object.assign(row, orig);
    row._edited = false;
  }
  render(true);
}

      <td>

        <div class="progress-wrap"><div class="progress-bar ${cat.key}" style="width:${pct}%"></div></div>
      </td>
      <td class="dates">${esc(d.start||'—')}<br>→ ${esc(d.target||'TBD')}</td>
      <td class="owner">${esc(d.parked||'—')}
        <span class="edit-icon" title="Edit" onclick="event.stopPropagation(); startEdit('${d._key}')">&#9998;</span>
      </td>
    </tr>`;

  let detailContent;
  if(isEditing){
    detailContent = `
      <div class="edit-form">
        <div class="detail-grid">
          <div class="detail-field"><label>Status / Stage</label><input data-field="status" type="text" value="${esc(d.status)}"></div>
          <div class="detail-field"><label>Parked With</label><input data-field="parked" type="text" value="${esc(d.parked)}"></div>
          <div class="detail-field"><label>Start Date</label><input data-field="start" type="text" value="${esc(d.start)}"></div>
          <div class="detail-field"><label>Target / Live Date</label><input data-field="target" type="text" value="${esc(d.target)}"></div>
          <div class="detail-field" style="grid-column:1/-1;"><label>Description</label><textarea data-field="description">${esc(d.description)}</textarea></div>
          <div class="detail-field" style="grid-column:1/-1;"><label>Comments / IT Notes</label><textarea data-field="comments">${esc(d.comments)}</textarea></div>
          <div class="detail-field" style="grid-column:1/-1;"><label>Action Required</label><textarea data-field="action">${esc(d.action)}</textarea></div>
        </div>
        <div class="row-actions">
          <button class="primary" onclick="event.stopPropagation(); saveRow('${d._key}')">Save</button>
          <button onclick="event.stopPropagation(); cancelEdit('${d._key}')">Cancel</button>
          ${d._edited ? `<button class="danger" onclick="event.stopPropagation(); revertRow('${d._key}')">Revert to Original</button>` : ''}
        </div>
      </div>`;
  } else {
    detailContent = `
      <div class="detail-grid">
        ${d.description ? `<div class="detail-field" style="grid-column:1/-1;"><label>Description</label><div class="val">${esc(d.description)}</div></div>` : ''}
        <div class="detail-field" style="grid-column:1/-1;"><label>Comments / IT Notes</label><div class="val">${esc(d.comments) || '—'}</div></div>
        <div class="detail-field" style="grid-column:1/-1;"><label>Action Required</label><div class="val">${esc(d.action) || '—'}</div></div>
      </div>
      <div class="row-actions">
        <button onclick="event.stopPropagation(); startEdit('${d._key}')">Edit</button>
        ${d._edited ? `<button class="danger" onclick="event.stopPropagation(); revertRow('${d._key}')">Revert to Original</button>` : ''}
      </div>`;
  }

  const detailRow = `<tr class="row-detail ${isOpen}" data-key="${d._key}"><td colspan="5">${detailContent}</td></tr>`;
  return mainRow + detailRow;
}

// track open/editing state across re-renders
let openKeys = new Set();
let editingKeys = new Set();

function render(preserveOnly){
  // capture current open/editing state before wiping DOM
  document.querySelectorAll('tr.row-detail').forEach(el => {
    const k = el.dataset.key;
    if(el.classList.contains('open')) openKeys.add(k); else openKeys.delete(k);
    if(el.dataset.editing === 'true') editingKeys.add(k); else editingKeys.delete(k);
  });

  renderStats();

  const main = document.getElementById('main');
  main.innerHTML = '';

  let anyVisible = false;

  trackers.forEach(tracker => {
    let rows = DATA.filter(d => d.tracker === tracker);
    const filtered = rows.filter(matchesFilters);
    if(filtered.length === 0) return;
    anyVisible = true;

    const sorted = sortRows(filtered, tracker);
    const collapsed = !!sectionCollapsed[tracker];

    const section = document.createElement('div');
    section.className = 'section' + (collapsed ? ' collapsed' : '');

    const cols = [
      {key:'sn', label:'#'}, {key:'project', label:'Project / Initiative'},
      {key:'status', label:'Status'}, {key:'target', label:'Timeline'}, {key:'parked', label:'Owner'}
    ];
    const st = sortState[tracker];

    section.innerHTML = `
      <div class="section-header" onclick="toggleSection('${tracker}')">
        <span class="chevron">&#9660;</span>
        <span class="title">${tracker}</span>
        <span class="count">${filtered.length} of ${rows.length}</span>
      </div>
      <div class="section-body">
        <table>
          <thead><tr>
            ${cols.map(c => `<th class="${st && st.col===c.key ? 'sorted':''}" onclick="event.stopPropagation(); sortBy('${tracker}','${c.key}')">${c.label}${st && st.col===c.key ? `<span class="arrow">${st.dir===1?'&#9650;':'&#9660;'}</span>` : ''}</th>`).join('')}
          </tr></thead>
          <tbody>
            ${sorted.map(d => renderRow(d, {open: openKeys.has(d._key), editing: editingKeys.has(d._key)})).join('')}
          </tbody>
        </table>
      </div>
    `;
    main.appendChild(section);
  });

  if(!anyVisible){
    main.innerHTML = '<div class="no-results">No initiatives match your search/filters.</div>';
  }
}

function sortBy(tracker, col){
  const cur = sortState[tracker];
  if(cur && cur.col === col){ cur.dir *= -1; }
  else{ sortState[tracker] = {col, dir:1}; }
  render(true);
}

document.getElementById('searchBox').addEventListener('input', () => render(true));
document.getElementById('trackerFilter').addEventListener('change', () => render(true));
document.getElementById('statusFilter').addEventListener('change', () => render(true));
document.getElementById('expandAllBtn').addEventListener('click', () => { trackers.forEach(t => sectionCollapsed[t]=false); render(true); });
document.getElementById('collapseAllBtn').addEventListener('click', () => { trackers.forEach(t => sectionCollapsed[t]=true); render(true); });
document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm('This will discard ALL local edits and restore the original data. Continue?')){
    edits = {}; saveEdits(edits);
    DATA = RAW_DATA.map(d => { const k=d.tracker+'::'+d.sn; const c=Object.assign({},d); c._key=k; c._edited=false; return c; });
    render();
  }
});
document.getElementById('exportBtn').addEventListener('click', () => {
  const headers = ['SN','Tracker','Project / Initiative','Description','Current Status / Stage','Start Date','Target / Live Date','Comments / IT Notes','Action Required','Parked With'];
  const csvRows = [headers.join(',')];
  DATA.forEach(d => {
    const row = [d.sn, d.tracker, d.project, d.description, d.status, d.start, d.target, d.comments, d.action, d.parked]
      .map(v => '"' + (v==null?'':String(v)).replace(/"/g,'""') + '"');
    csvRows.push(row.join(','));
  });
  const blob = new Blob([csvRows.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'progress_tracker_export.csv';
  a.click();
  URL.revokeObjectURL(url);
});

populateTrackerFilter();
render();
</script>
</body>
</html>
